[package]
name = "claude-usage"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "claude-usage"
path = "src/bin/claude-usage.rs"

[[bin]]
name = "claude-usage-cli"
path = "src/bin/claude-usage-cli.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking", "http2", "charset", "system-proxy",
    "rustls-no-provider", "gzip", "brotli", "deflate", "zstd", "json",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", features = ["persistence"] }
egui_plot = "0.37.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
