[package]
name = "claude-usage"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "claude-usage"
path = "src/bin/claude-usage.rs"

[[bin]]
name = "claude-usage-cli"
path = "src/bin/claude-usage-cli.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "blocking", "http2", "charset", "system-proxy",
    "rustls-no-provider", "gzip", "brotli", "deflate", "zstd", "json",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", features = ["persistence"] }
tempfile = "3"
# eframe's own (0.12); reads app.ron before run_native.
ron = "0.12"
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "time", "io-std"] }
schemars = "1"
# eframe's own (via image): encodes the app icon the toasts show.
png = "0.18"
# Already in the tree (via rustls): sha256 of CLAUDE_CONFIG_DIR for the
# Keychain service name (profiles).
ring = "0.17"

[target.'cfg(windows)'.dependencies]
# Already in the tree (via clap): MessageBoxW, window placement and the pill's
# rounded corners (ui::window).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    # The toasts' app id (notify): the HKCU AppUserModelId key and the
    # process tag. Security: RegCreateKeyExW's SECURITY_ATTRIBUTES.
    "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security",
    # The tray toggle's double-click debounce (GetDoubleClickTime).
    "Win32_UI_Input_KeyboardAndMouse",
] }
# eframe's own (0.6): the HWND of the main window for its startup placement.
raw-window-handle = "0.6"
# Threshold alert toasts (windows 0.62, already in the tree; no aws-lc).
tauri-winrt-notification = "=0.8.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The tray icon with the live 5-hour % (Windows: a badge icon) or the
# menu-bar item with every account's % as its title (macOS). No aws-lc/nasm.
tray-icon = "=0.26.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
# Already in the tree via epaint; tests read font charmaps with it.
skrifa = "=0.44.0"
rmcp = { version = "=3.5.1", features = ["client", "server", "macros"] }
